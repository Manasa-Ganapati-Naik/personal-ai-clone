<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Model Demo</title>
  <style>
    body{font-family:system-ui,Segoe UI,Arial;margin:24px}
    textarea{width:100%;height:120px}
    pre{white-space:pre-wrap;background:#f6f6f6;padding:12px;border-radius:6px}
  </style>
</head>
<body>
  <h2>Personal AI — Demo</h2>
  <textarea id="prompt" placeholder="Type a prompt...">Hey, could you write a friendly reminder about the meeting tomorrow?</textarea>
  <br/><br/>
  <label>Max length <input id="maxlen" type="number" value="80" style="width:80px"></label>
  <label> Temp <input id="temp" type="number" step="0.1" value="0.7" style="width:80px"></label>
  <button id="gen">Generate</button>
  <h3>Output</h3>
  <pre id="out">—</pre>

  <script>
    const btn = document.getElementById('gen');
    btn.addEventListener('click', async () => {
      const prompt = document.getElementById('prompt').value;
      const max_length = Number(document.getElementById('maxlen').value) || 80;
      const temperature = Number(document.getElementById('temp').value) || 0.7;

      try {
        const res = await fetch('http://127.0.0.1:8000/generate', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ prompt, max_length, temperature, top_p: 0.9, do_sample: true })
        });
        if (!res.ok) {
          const text = await res.text();
          document.getElementById('out').textContent = `Error: ${res.status} ${text}`;
          return;
        }
        const j = await res.json();
        document.getElementById('out').textContent = j.generated_text;
      } catch (e) {
        document.getElementById('out').textContent = 'Request failed: ' + e;
      }
    });
  </script>
</body>
</html>
