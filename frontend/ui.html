<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Text Generator</title>
</head>
<body>
    <h2>AI Text Generator</h2>
    <textarea id="prompt" rows="4" cols="50" placeholder="Type your prompt here..."></textarea><br>
    <button onclick="generateText()">Generate</button>
    <pre id="output"></pre>

    <!-- Step 1: JavaScript goes here -->
    <script>
    async function generateText() {
        const prompt = document.getElementById("prompt").value;

        try {
            const response = await fetch("http://127.0.0.1:8000/generate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prompt: prompt, max_length: 80 })
            });

            const data = await response.json();
            document.getElementById("output").textContent = data.generated_text;

        } catch (err) {
            console.error("Error fetching:", err);
            document.getElementById("output").textContent = "Failed to fetch response.";
        }
    }
    </script>
</body>
</html>
